---
- name: Get installed node_exporter version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download and extract Node Exporter {{ node_exporter_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /usr/local/bin/
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --wildcards
      - "*/node_exporter"
  when: >-
    ('version ' ~ node_exporter_version ~ ' ') not in
    ((node_exporter_installed.stdout | default('')) ~ (node_exporter_installed.stderr | default('')))
  notify: Restart node_exporter

- name: Deploy systemd unit file
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  register: node_exporter_unit
  notify: Restart node_exporter

- name: Make sure node_exporter is enabled and running
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    masked: false
    daemon_reload: true
  when: not (ansible_check_mode and node_exporter_unit is changed)
