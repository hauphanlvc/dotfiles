---
- name: Install Docker CE (Debian/Ubuntu)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Add Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
      register: docker_repo

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: "{{ docker_repo is changed }}"
        state: present

- name: Install Docker CE (Fedora)
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Add Docker CE repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/fedora/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Install Docker
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

- name: Ensure docker service is enabled and started
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

# Takes effect after logging out and back in (or `newgrp docker`)
- name: Allow {{ target_user }} to use docker without sudo
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: true
