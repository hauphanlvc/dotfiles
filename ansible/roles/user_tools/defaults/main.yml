---
# Installed once with the vendor script; each tool updates itself afterwards.
# PATH setup lives in dotfiles (config/bash/bashrc.user), so installers are
# told not to edit ~/.bashrc / ~/.profile where they support it.
# zed only prints a PATH hint; the antigravity installer has no such flag
# and appends `export PATH="$HOME/.local/bin:$PATH"` to ~/.bashrc.
user_tools:
  - name: rustup
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
    creates: "{{ target_home }}/.cargo/bin/rustup"
  - name: zed
    cmd: curl -f https://zed.dev/install.sh | sh
    creates: "{{ target_home }}/.local/bin/zed"
  - name: opencode
    cmd: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
    creates: "{{ target_home }}/.opencode/bin/opencode"
  - name: antigravity-cli
    cmd: curl -fsSL https://antigravity.google/cli/install.sh | bash
    creates: "{{ target_home }}/.local/bin/agy"
