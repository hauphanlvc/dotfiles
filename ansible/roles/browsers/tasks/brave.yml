---
- name: Download brave-browser-nightly keyring and sources
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - { url: "https://brave-browser-apt-nightly.s3.brave.com/brave-browser-nightly-archive-keyring.gpg", dest: "/usr/share/keyrings/brave-browser-nightly-archive-keyring.gpg" }
    - { url: "https://brave-browser-apt-nightly.s3.brave.com/brave-browser.sources", dest: "/etc/apt/sources.list.d/brave-browser-nightly.sources" }

- name: Install Brave nightly
  ansible.builtin.apt:
    name: brave-browser-nightly
    update_cache: true
    state: present
