---
# ansible_facts.packages is gathered once in the common role (tagged `always`)

- name: Install standard Firefox and Google Chrome (Debian/Ubuntu)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Install Firefox
      ansible.builtin.apt:
        name: firefox
        state: present

    - name: Install Google Chrome (latest)
      ansible.builtin.apt:
        deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      when: "'google-chrome-stable' not in ansible_facts.packages"

- name: Install standard Firefox and Google Chrome (Fedora)
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Install Firefox
      ansible.builtin.dnf:
        name: firefox
        state: present

    - name: Install Google Chrome (latest)
      ansible.builtin.dnf:
        name: https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
        state: present
        disable_gpg_check: true
      when: "'google-chrome-stable' not in ansible_facts.packages"
