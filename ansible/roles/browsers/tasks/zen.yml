---
# Only download when the installed version differs from the latest release tag,
# and wipe the old folder first so files from previous versions don't pile up.
- name: Look up latest Zen release
  ansible.builtin.uri:
    url: https://api.github.com/repos/zen-browser/desktop/releases/latest
  register: zen_release
  check_mode: false

- name: Get installed Zen version
  ansible.builtin.command: grep -m1 -oP '^Version=\K.+' /opt/zen/application.ini
  register: zen_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Zen {{ zen_release.json.tag_name }}
  when: zen_installed.stdout != zen_release.json.tag_name
  block:
    - name: Remove old Zen folder
      ansible.builtin.file:
        path: /opt/zen
        state: absent

    - name: Download and extract Zen
      ansible.builtin.unarchive:
        src: "https://github.com/zen-browser/desktop/releases/download/{{ zen_release.json.tag_name }}/zen.linux-x86_64.tar.xz"
        dest: /opt/
        remote_src: true

- name: Configure zen browser alternative
  community.general.alternatives:
    name: zen
    path: /opt/zen/zen
    link: /usr/bin/zen
    priority: 100
    state: present

- name: Add Zen desktop entry
  ansible.builtin.copy:
    src: zen.desktop
    dest: /usr/share/applications/zen.desktop
    mode: '0644'
