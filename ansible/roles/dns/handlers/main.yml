---
# Keep NetworkManager before systemd-resolved so NM stops pushing DHCP DNS
# before systemd-resolved restarts and clears stale per-link DNS servers.
- name: Restart NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: restarted
  when:
    - not ansible_check_mode
    - "'NetworkManager.service' in ansible_facts.services"
    - ansible_facts.services['NetworkManager.service'].state == 'running'

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when:
    - not ansible_check_mode
    - "'systemd-resolved.service' in ansible_facts.services"
    - ansible_facts.services['systemd-resolved.service'].state == 'running'
