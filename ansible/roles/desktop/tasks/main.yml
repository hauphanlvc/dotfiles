---
- name: Configure desktop packages (Debian/Ubuntu)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    # ubuntu-restricted-extras pulls ttf-mscorefonts-installer, which blocks on an EULA prompt
    - name: Pre-accept Microsoft core fonts EULA
      ansible.builtin.debconf:
        name: ttf-mscorefonts-installer
        question: msttcorefonts/accepted-mscorefonts-eula
        value: "true"
        vtype: select

    - name: Install desktop packages
      ansible.builtin.apt:
        name: "{{ desktop_packages_debian }}"
        state: present

    # tlp is the only power manager; it conflicts with Ubuntu's power-profiles-daemon
    - name: Remove power-profiles-daemon
      ansible.builtin.apt:
        name: power-profiles-daemon
        state: absent

- name: Configure desktop packages (Fedora)
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    # Fedora defaults to tuned-ppd, which conflicts with tlp
    - name: Remove tuned and tuned-ppd before installing TLP
      ansible.builtin.dnf:
        name:
          - tuned-ppd
          - tuned
        state: absent

    - name: Enable COPR repository for fcitx5-bamboo
      community.general.copr:
        name: vuongtuha/fcitx5-bamboo
        state: enabled

    - name: Install desktop packages
      ansible.builtin.dnf:
        name: "{{ desktop_packages_redhat }}"
        state: present

    - name: Enable and start TLP service
      ansible.builtin.systemd_service:
        name: tlp
        enabled: true
        state: started

- name: Install Source Code Pro font (Debian/Ubuntu)
  become: false
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Clone Source Code Pro release branch
      ansible.builtin.git:
        repo: https://github.com/adobe-fonts/source-code-pro.git
        dest: "{{ target_home }}/.cache/source-code-pro"
        version: release
        depth: 1
      register: desktop_source_code_pro_clone

    - name: Create Source Code Pro font directory
      ansible.builtin.file:
        path: "{{ desktop_source_code_pro_dir }}"
        state: directory
        mode: '0755'

    - name: Copy Source Code Pro OTF files
      ansible.builtin.copy:
        src: "{{ target_home }}/.cache/source-code-pro/OTF/"
        dest: "{{ desktop_source_code_pro_dir }}/"
        remote_src: true
        mode: '0644'
      when: not (ansible_check_mode and desktop_source_code_pro_clone is changed)
      notify: Refresh font cache

- name: Install Hack Nerd Font Mono
  become: false
  block:
    - name: Create Hack Nerd Font directory
      ansible.builtin.file:
        path: "{{ desktop_hack_nerd_font_dir }}"
        state: directory
        mode: '0755'

    - name: Check if Hack Nerd Font Mono is already installed
      ansible.builtin.stat:
        path: "{{ desktop_hack_nerd_font_dir }}/HackNerdFontMono-Regular.ttf"
      register: desktop_hack_nerd_font_stat

    - name: Download and extract Hack Nerd Font
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.tar.xz
        dest: "{{ desktop_hack_nerd_font_dir }}"
        remote_src: true
      when: not desktop_hack_nerd_font_stat.stat.exists
      notify: Refresh font cache
