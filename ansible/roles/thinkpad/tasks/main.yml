---
- name: Remove conflicting power managers on Fedora before configuring TLP
  ansible.builtin.dnf:
    name:
      - tuned-ppd
      - tuned
      - power-profiles-daemon
    state: absent
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure TLP and TLP Profiles Daemon are installed (Fedora)
  ansible.builtin.dnf:
    name:
      - tlp
      - tlp-pd
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure TLP is installed (Debian/Ubuntu)
  ansible.builtin.apt:
    name: tlp
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure TLP services are enabled and started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ ['tlp', 'tlp-pd'] if ansible_facts['os_family'] == 'RedHat' else ['tlp'] }}"
  when: not ansible_check_mode

- name: Configure TLP ThinkPad battery charge thresholds
  ansible.builtin.copy:
    src: 01-thinkpad.conf
    dest: /etc/tlp.d/01-thinkpad.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload TLP

- name: Apply opt-in ThinkPad I2C touchpad workarounds
  ansible.builtin.include_tasks: touchpad.yml
  when: thinkpad_touchpad_fix | bool
