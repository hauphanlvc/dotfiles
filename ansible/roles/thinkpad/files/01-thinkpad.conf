START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# Prevent TLP from enabling runtime PM autosuspend on the Intel LPSS I2C controller (00:15.0)
# when running on battery power, which causes ELAN I2C touchpad lag/stutter.
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau radeon xhci_hcd intel-lpss"
RUNTIME_PM_DENYLIST="00:15.0"
