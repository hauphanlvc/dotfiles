---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# Used by the browsers and apps roles. Tagged `always` so it still runs
# when only one role is selected, e.g. `--tags apps`.
- name: Gather installed package facts
  ansible.builtin.package_facts:
  tags: [always]
