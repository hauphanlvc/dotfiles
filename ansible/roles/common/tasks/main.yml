---
- name: Gather installed package facts
  ansible.builtin.package_facts:
  tags: [always]

- name: Configure Debian/Ubuntu base packages
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common Debian/Ubuntu packages
      ansible.builtin.apt:
        name: "{{ common_packages_debian }}"
        state: present

- name: Configure Fedora base packages and RPM Fusion
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Enable RPM Fusion Free and Nonfree repositories
      ansible.builtin.dnf:
        name:
          - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Install common Fedora packages
      ansible.builtin.dnf:
        name: "{{ common_packages_redhat }}"
        state: present

    - name: Swap ffmpeg-free for full RPM Fusion ffmpeg
      ansible.builtin.command: dnf swap -y ffmpeg-free ffmpeg --allowerasing
      when: "'ffmpeg-free' in ansible_facts.packages"
      changed_when: true

    - name: Ensure full ffmpeg is installed on Fedora
      ansible.builtin.dnf:
        name: ffmpeg
        state: present
      when: "'ffmpeg-free' not in ansible_facts.packages"
