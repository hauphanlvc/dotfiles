---
- name: Install Anki dependency packages
  ansible.builtin.apt:
    name: "{{ anki_dependencies }}"
    state: present

# `anki --version` starts Anki briefly, so run it as the user, not root.
# Output is "Starting Anki X...\nAnki X"; match the exact "Anki X" line.
- name: Get installed Anki version
  become: false
  ansible.builtin.command: anki --version
  register: anki_installed
  changed_when: false
  failed_when: false
  check_mode: false

# The installer copies files into /usr/local, so this part still needs root
- name: Install Anki {{ anki_version }}
  when: ('Anki ' ~ anki_version) not in (anki_installed.stdout_lines | default([]))
  block:
    - name: Download and extract Anki
      ansible.builtin.unarchive:
        src: "https://github.com/ankitects/anki/releases/download/{{ anki_version }}/anki-{{ anki_version }}-linux-x86_64.tar.zst"
        dest: /tmp
        remote_src: true

    - name: Run Anki installer
      ansible.builtin.command:
        cmd: ./install.sh
        chdir: /tmp/anki-linux/

    - name: Clean up Anki installer
      ansible.builtin.file:
        path: /tmp/anki-linux
        state: absent
