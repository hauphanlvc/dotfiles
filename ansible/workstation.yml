---
- name: Set up workstation
  hosts: local
  gather_facts: true          # ansible_distribution_release is used by repo tasks
  become: true
  roles:
    - { role: common,     tags: [common] }
    - { role: dev,        tags: [dev] }
    - { role: neovim,     tags: [neovim] }
    - { role: desktop,    tags: [desktop] }
    - { role: sway,       tags: [sway] }
    - { role: niri,       tags: [niri] }
    - { role: flatpak,    tags: [flatpak] }
    - { role: docker,     tags: [docker] }
    - { role: browsers,   tags: [browsers] }
    - { role: apps,       tags: [apps] }
    - { role: k8s,        tags: [k8s] }
    - { role: user_tools, tags: [user_tools], become: false }
